function Md({text}){
  const html=text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\*\*\*(.*?)\*\*\*/g,'<strong><em>$1</em></strong>')
    .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.*?)\*/g,'<em>$1</em>')
    .replace(/`(.*?)`/g,'<code>$1</code>')
    .replace(/^### (.*$)/gm,'<h4>$1</h4>')
    .replace(/^## (.*$)/gm,'<h3>$1</h3>')
    .replace(/^# (.*$)/gm,'<h3>$1</h3>')
    .replace(/^\- (.*$)/gm,'<li>$1</li>')
    .replace(/^\* (.*$)/gm,'<li>$1</li>')
    .replace(/^(\d+)\. (.*$)/gm,'<li>$2</li>')
    .replace(/(<li>.*<\/li>\n?)+/g,m=>'<ul>'+m+'</ul>')
    .replace(/\n\n/g,'</p><p>')
    .replace(/\n/g,'<br/>');
  return <div dangerouslySetInnerHTML={{__html:'<p>'+html+'</p>'}}/>;
}

function EligibilityQuiz({onChat}){
  const[step,setStep]=useState(0);
  const[ans,setAns]=useState({});
  const qs=[
    {q:'Where are you right now?',opts:['Outside Canada','In Canada (student)','In Canada (worker)','In Canada (visitor)']},
    {q:'What is your highest education?',opts:['No formal / High School','College diploma (1-2 yr)','Bachelor\'s degree','Master\'s or PhD']},
    {q:'How many years of skilled work experience?',opts:['None','1-2 years','3-5 years','5+ years']},
    {q:'How would you rate your English/French?',opts:['Beginner','Intermediate (CLB 5-6)','Advanced (CLB 7-8)','Expert (CLB 9+)']},
    {q:'Do you have family in Canada?',opts:['No','Yes — spouse/partner is PR/citizen','Yes — sibling is PR/citizen','Yes — parent is PR/citizen']},
  ];
  const results=()=>{
    const paths=[];
    const loc=ans[0]||0,edu=ans[1]||0,exp=ans[2]||0,lang=ans[3]||0,fam=ans[4]||0;
    if(lang>=2&&edu>=2&&exp>=1)paths.push({n:'Express Entry (FSW)',c:'var(--mp)',p:'High'});
    if(loc>=1&&loc<=2&&exp>=1)paths.push({n:'Canadian Experience Class',c:'var(--mp)',p:'High'});
    if(exp>=1)paths.push({n:'Provincial Nominee Program',c:'var(--sk)',p:'High'});
    if(edu>=1)paths.push({n:'Study in Canada → PGWP → PR',c:'var(--cy)',p:'Medium'});
    if(loc===0)paths.push({n:'IEC Working Holiday',c:'var(--am)',p:'Medium'});
    if(fam===1)paths.push({n:'Spousal Sponsorship',c:'var(--vi)',p:'High'});
    if(fam>=2)paths.push({n:'Family Sponsorship',c:'var(--vi)',p:'Medium'});
    if(exp>=2)paths.push({n:'LMIA Work Permit',c:'var(--am)',p:'Medium'});
    if(edu===3)paths.push({n:'Masters/PhD PNP Stream',c:'var(--cy)',p:'High'});
    if(paths.length===0)paths.push({n:'Study Permit → Work → PR',c:'var(--cy)',p:'Starting Point'});
    return paths;
  };
  if(step>=qs.length)return(<div className="quiz-result"><div style={{fontSize:'2rem',marginBottom:'8px'}}>🎯</div><div className="h3" style={{marginBottom:'4px'}}>Your Matching Pathways</div><p style={{fontSize:'.82rem',color:'var(--tx2)',marginBottom:'16px'}}>Based on your answers, here are your options:</p><div style={{display:'flex',flexWrap:'wrap',justifyContent:'center',gap:'6px',marginBottom:'20px'}}>{results().map((r,i)=><span key={i} className="quiz-match" style={{background:r.c+'18',color:r.c,borderColor:r.c}}>{r.n} — {r.p}</span>)}</div><div style={{display:'flex',gap:'8px',justifyContent:'center',flexWrap:'wrap'}}><button className="btn btn-p btn-sm" onClick={()=>{setStep(0);setAns({})}}>Retake Quiz</button><button className="btn btn-s btn-sm" onClick={()=>onChat('Based on my quiz results, I\'m '+['outside Canada','a student in Canada','a worker in Canada','a visitor in Canada'][ans[0]||0]+' with '+['no formal education','a college diploma','a bachelor\'s degree','a master\'s or PhD'][ans[1]||0]+', '+['no','1-2 years','3-5 years','5+ years'][ans[2]||0]+' of work experience, and '+['beginner','intermediate','advanced','expert'][ans[3]||0]+' English. What are my best immigration options?')}>💬 Get Detailed AI Advice</button></div></div>);
  return(<div className="quiz-step"><div className="quiz-progress">{qs.map((_,i)=><div key={i} className={`quiz-dot ${i===step?'active':i<step?'done':''}`}/>)}</div><div className="quiz-q">{qs[step].q}</div><div className="quiz-opts">{qs[step].opts.map((o,i)=><div key={i} className="quiz-opt" onClick={()=>{setAns({...ans,[step]:i});setStep(step+1)}}>{o}</div>)}</div>{step>0&&<button className="btn btn-s btn-sm" style={{marginTop:'12px'}} onClick={()=>setStep(step-1)}>← Back</button>}</div>);
}

const SC={ee:<div className="body"><p><strong>Express Entry</strong> manages three federal programs using the CRS to rank candidates out of 1,200.</p><h4>Federal Skilled Worker (FSW)</h4><ul><li><strong>Experience:</strong> 1+ year in TEER 0/1/2/3 in last 10 years</li><li><strong>Language:</strong> CLB 7 minimum</li><li><strong>Education:</strong> Canadian credential or ECA</li><li><strong>Points grid:</strong> 67/100 on selection factors</li><li><strong>Funds:</strong> ~$14,690 CAD (single)</li></ul><h4>Canadian Experience Class (CEC)</h4><ul><li>12+ months Canadian skilled work in last 3 years</li><li>CLB 7 for TEER 0/1; CLB 5 for TEER 2/3</li><li>No education or funds requirement</li></ul><h4>Federal Skilled Trades (FST)</h4><ul><li>2+ years in skilled trade within last 5 years</li><li>Valid job offer or certificate of qualification</li><li>CLB 5 speaking/listening; CLB 4 reading/writing</li></ul><h4>Process</h4><ol style={{paddingLeft:'18px'}}><li>Create profile → Enter pool → Receive ITA → Submit app (60 days) → Processing ~6 months → COPR</li></ol><h4>Category-Based Draws (2023+)</h4><p>Targeted draws for <strong>French, healthcare, STEM, trades, transport, agriculture</strong> with lower CRS cut-offs.</p></div>,
pnp:<div className="body"><p>Each province (except Nunavut/Québec) has a PNP. Nomination = <strong>+600 CRS</strong>.</p><h4>Enhanced vs Base</h4><ul><li><strong>Enhanced:</strong> +600 CRS → ITA in next draw (~6 mo)</li><li><strong>Base:</strong> Apply to IRCC directly (15–19 mo)</li></ul><h4>Key Provinces</h4><p><strong>Ontario</strong> — Human Capital, Employer, Masters/PhD, Tech.</p><p><strong>BC</strong> — Skills Immigration, Tech (29 occupations), Regional.</p><p><strong>Alberta</strong> — Express Entry, Opportunity, Rural Renewal.</p><p><strong>Saskatchewan</strong> — Lower requirements. Occupation In-Demand list.</p><p><strong>Manitoba</strong> — Skilled Workers, International Education.</p><p><strong>Atlantic provinces, Yukon, NWT</strong> — Various targeted streams.</p></div>,
work:<div className="body"><h4>LMIA Work Permits</h4><ul><li>Employer proves no Canadian available. $1,000/position</li></ul><h4>LMIA-Exempt</h4><ul><li><strong>Intra-Company Transfers</strong> — executives/managers</li><li><strong>IEC (Working Holiday)</strong> — youth 18–35</li><li><strong>CUSMA</strong> — US/Mexico professionals</li><li><strong>Spousal Open Work Permits</strong></li></ul><h4>PGWP</h4><ul><li>Duration matches program (up to 3 years)</li><li>Apply within 180 days of final marks</li><li>Language requirements added 2024</li><li>One-time permit only</li></ul><h4>Fees</h4><p>Work permit: <strong>$155</strong> | Open WP: <strong>$100</strong> | Biometrics: <strong>$85</strong></p></div>,
study:<div className="body"><h4>Requirements</h4><ul><li>DLI acceptance letter + PAL (since Jan 2024)</li><li>Funds: tuition + $20,635/year</li><li>Police clearance + medical exam</li></ul><h4>Working</h4><ul><li>On-campus: unlimited | Off-campus: 24 hrs/week | Co-op: separate permit</li></ul><h4>PR Path</h4><p>Complete DLI → PGWP → 1 year skilled work → Express Entry (CEC) or PNP</p><h4>Tuition</h4><table className="tbl"><thead><tr><th>Level</th><th>Annual</th></tr></thead><tbody><tr><td>Undergraduate</td><td className="amt">$22K–$55K</td></tr><tr><td>Masters</td><td className="amt">$18K–$45K</td></tr><tr><td>College</td><td className="amt">$12K–$25K</td></tr></tbody></table></div>,
visit:<div className="body"><h4>Visitor Visa (TRV)</h4><ul><li>$100/person + $85 biometrics</li><li>Up to 10 years validity, 6-month stays</li></ul><h4>eTA</h4><ul><li>$7 | Minutes processing | Up to 5 years</li></ul><h4>Super Visa</h4><ul><li>Parents/grandparents: up to 5 years per visit</li><li>Sponsor must meet LICO + 30%</li><li>Canadian health insurance required ($100K min)</li></ul></div>,
family:<div className="body"><h4>Spousal Sponsorship</h4><ul><li>~12 months processing | ~$2,140 total fees</li><li>Inland: Open Work Permit while waiting</li><li>No income requirement</li></ul><h4>Parents/Grandparents</h4><ul><li>Limited annual intake (lottery)</li><li>3-year income requirement | 20-year undertaking</li><li>Processing: 20–24 months</li></ul></div>,
refugee:<div className="body"><h4>Claims</h4><ul><li>Port of Entry or Inland at IRCC office</li><li>BOC form within 15 days</li></ul><h4>Programs</h4><ul><li><strong>GAR:</strong> Government-assisted (1 year support)</li><li><strong>PSR:</strong> Privately sponsored (1 year)</li><li><strong>BVOR:</strong> Blended (6 + 6 months)</li></ul><h4>Rights</h4><p>Work permits, IFHP healthcare, settlement services during processing.</p></div>,
fees:<div className="body"><table className="tbl"><thead><tr><th>Category</th><th>Fee (CAD)</th></tr></thead><tbody><tr><td>Express Entry PR</td><td className="amt">$1,365</td></tr><tr><td>RPRF</td><td className="amt">$515</td></tr><tr><td>Sponsorship</td><td className="amt">$1,050</td></tr><tr><td>Study Permit</td><td className="amt">$150</td></tr><tr><td>Work Permit</td><td className="amt">$155</td></tr><tr><td>Visitor Visa</td><td className="amt">$100</td></tr><tr><td>eTA</td><td className="amt">$7</td></tr><tr><td>Biometrics</td><td className="amt">$85</td></tr><tr><td>Citizenship</td><td className="amt">$630</td></tr><tr><td>LMIA</td><td className="amt">$1,000</td></tr></tbody></table><h4>Extra Costs</h4><table className="tbl"><thead><tr><th>Item</th><th>Cost</th></tr></thead><tbody><tr><td>Medical Exam</td><td className="amt">$200–$450</td></tr><tr><td>IELTS</td><td className="amt">$320–$350</td></tr><tr><td>ECA (WES)</td><td className="amt">$200–$350</td></tr></tbody></table></div>,
settle:<div className="body"><h4>First Week</h4><ul><li><strong>SIN</strong> at Service Canada (free)</li><li><strong>Bank account</strong> — newcomer packages (RBC, TD, BMO, Scotiabank, CIBC)</li><li><strong>Phone</strong> — Rogers, Bell, Telus, Freedom</li><li><strong>Health card</strong> — apply immediately (3-month wait possible)</li></ul><h4>First 30 Days</h4><ul><li>Housing (Rentals.ca, Kijiji, Realtor.ca)</li><li>Job search (Job Bank, Indeed, LinkedIn)</li><li>Credential assessment</li><li>Enroll children in school (free)</li><li>Driver's license exchange</li></ul><h4>Free Settlement Services</h4><p>Language classes (LINC/CLIC), job workshops, community connections, housing help.</p></div>,
tax:<div className="body"><h4>Federal Tax Brackets</h4><table className="tbl"><thead><tr><th>Income</th><th>Rate</th></tr></thead><tbody><tr><td>Up to $55,867</td><td className="amt">15%</td></tr><tr><td>$55,867–$111,733</td><td className="amt">20.5%</td></tr><tr><td>$111,733–$154,906</td><td className="amt">26%</td></tr><tr><td>$154,906–$220,000</td><td className="amt">29%</td></tr><tr><td>Over $220,000</td><td className="amt">33%</td></tr></tbody></table><h4>Benefits</h4><ul><li><strong>GST/HST Credit</strong> — quarterly for low income</li><li><strong>CCB</strong> — up to $7,437/yr per child under 6</li><li><strong>RRSP</strong> — tax-deductible retirement savings</li><li><strong>TFSA</strong> — tax-free growth (~$7,000/yr)</li></ul><h4>Banking</h4><p>Major banks offer <strong>newcomer packages</strong> with fee waivers and no-history credit cards.</p><h4>Cost of Living</h4><table className="tbl"><thead><tr><th></th><th>Toronto</th><th>Vancouver</th><th>Calgary</th></tr></thead><tbody><tr><td>Rent 1BR</td><td className="amt">$2,300</td><td className="amt">$2,500</td><td className="amt">$1,600</td></tr><tr><td>Groceries</td><td className="amt">$350</td><td className="amt">$350</td><td className="amt">$300</td></tr></tbody></table></div>,
citizen:<div className="body"><h4>Eligibility</h4><ul><li>PR present <strong>1,095 days</strong> in 5 years</li><li>Taxes filed 3+ years in 5-year period</li><li>CLB 4+ English/French (18–54)</li><li>Pass citizenship test (18–54)</li></ul><h4>Process</h4><p>Apply online ($630 adult) → Study "Discover Canada" → Test (20 questions, 75% pass) → Oath ceremony</p><h4>Dual Citizenship</h4><p>Canada <strong>allows</strong> dual citizenship. No need to give up your current one.</p><h4>Benefits</h4><ul><li>Canadian passport (180+ visa-free countries)</li><li>Vote and run for office</li><li>Cannot lose citizenship by living abroad</li></ul></div>,
quebec:<div className="body"><h4>Quebec is a Separate Immigration System</h4><p>Quebec controls its own immigration through <strong>MIFI</strong> (Ministère de l'Immigration). You need Quebec selection (CSQ) BEFORE applying for federal PR.</p><h4>Key Programs</h4><ul><li><strong>Arrima (Quebec Skilled Worker):</strong> Points-based Expression of Interest. French heavily weighted. Processing: 12-24 months CSQ + 12-18 months federal PR.</li><li><strong>PEQ (Programme de l'expérience québécoise):</strong> FAST TRACK — CSQ in 20 days for: (a) Quebec graduates with intermediate French, (b) Temporary workers in QC with 24 months skilled work + intermediate French.</li><li><strong>Quebec Business:</strong> Entrepreneur, Investor ($1.2M net worth + $200K investment), Self-employed</li></ul><h4>Quebec-Specific Requirements</h4><ul><li><strong>CAQ:</strong> Required BEFORE applying for study/work permit in Quebec</li><li><strong>CSQ:</strong> Required for PR through Quebec</li><li><strong>French:</strong> Essentially mandatory. B2 (intermediate) minimum for PEQ. Tests: TCF, TEF, DELF/DALF</li></ul><h4>Why Choose Quebec?</h4><ul><li>PEQ is one of the FASTEST PR pathways in Canada</li><li>Montreal is affordable compared to Toronto/Vancouver (rent ~$1,300-1,700)</li><li>If you speak French, Quebec is MUCH easier than other provinces</li><li>Strong cultural scene, European feel, diverse food scene</li></ul><p><strong>Important:</strong> You cannot apply through Express Entry and Quebec programs simultaneously.</p></div>,
atlantic:<div className="body"><h4>Atlantic Immigration Program (AIP)</h4><p>An underrated, employer-driven pathway for Nova Scotia, New Brunswick, PEI, and Newfoundland. <strong>No CRS score competition.</strong></p><h4>How It Works</h4><ol style={{paddingLeft:'18px'}}><li>Find a designated Atlantic employer who offers you a job</li><li>Employer applies for designation (if not already)</li><li>You and employer submit application together</li><li>Get provincial endorsement</li><li>Apply for federal PR</li></ol><h4>Requirements</h4><ul><li><strong>Job offer:</strong> Full-time, non-seasonal, TEER 0-4 (accepts lower-skilled jobs!)</li><li><strong>Experience:</strong> 1 year work in last 5 years (TEER 0-3). International graduates from Atlantic DLIs: no experience needed</li><li><strong>Language:</strong> CLB 5 (TEER 0-3) or CLB 4 (TEER 4) — lower than Express Entry!</li><li><strong>Education:</strong> High school minimum + ECA for foreign credentials</li><li><strong>Settlement plan:</strong> From a designated settlement agency (free)</li></ul><h4>Advantages</h4><ul><li>Accepts TEER 4 jobs (cashiers, food counter, farm workers, etc.)</li><li>No CRS competition — your score doesn't matter</li><li>Lower cost of living (Halifax rent ~$1,600, Moncton ~$1,200)</li><li>Faster processing (~6-12 months)</li><li>Halifax is becoming a tech hub</li><li>Friendly communities with strong newcomer support</li></ul></div>,
catdraw:<div className="body"><h4>Category-Based Selection (Since 2023)</h4><p>IRCC now runs <strong>targeted Express Entry draws</strong> for specific occupation groups. These have MUCH lower CRS cut-offs than general draws (300-470 vs 520-545).</p><h4>Categories & Qualifying Occupations</h4><ul><li><strong>Healthcare:</strong> Physicians, dentists, pharmacists, nurses (RN, LPN), physiotherapists, occupational therapists, medical lab techs, paramedics, respiratory therapists, dental hygienists (NOC 31100-31303)</li><li><strong>STEM:</strong> Software developers, data scientists, engineers (all types), architects, mathematicians, statisticians, database analysts, computer network techs, cybersecurity (NOC 20010-22310)</li><li><strong>Trades:</strong> Electricians, plumbers, steamfitters, carpenters, heavy equipment operators, crane operators, welders, millwrights, machinists (NOC 72xxx-73xxx)</li><li><strong>Transport:</strong> Transport truck drivers, railway workers, bus drivers, heavy equipment operators (NOC 73300-74200)</li><li><strong>Agriculture & Agri-food:</strong> Farm managers, agriculture workers, food processing workers, butchers, bakers (NOC 80020-85100)</li><li><strong>French-language proficiency:</strong> ANY occupation — must demonstrate strong French skills (NCLC 7+)</li></ul><h4>Why This Matters</h4><p>If your occupation falls in any category above, you could get an ITA with a CRS as low as <strong>300-470</strong> instead of 520+. This is a game-changer for people who couldn't qualify under general draws.</p><h4>How to Qualify</h4><ol style={{paddingLeft:'18px'}}><li>Verify your NOC code falls in a target category</li><li>Create/update your Express Entry profile</li><li>Ensure you have valid work experience in that NOC</li><li>Wait for a category-specific draw targeting your group</li><li>Draws happen regularly but not on a fixed schedule</li></ol><p><strong>Tip:</strong> If you're in healthcare or STEM, you're in the most frequently targeted categories. Keep your profile active and language scores current.</p></div>,
caregiver:<div className="body"><h4>Caregiver Immigration Programs</h4><p>Canada has dedicated PR pathways for caregivers — less competitive than Express Entry.</p><h4>Home Child Care Provider Pilot</h4><ul><li>Job offer in home child care (NOC 44100)</li><li>CLB 5 in English or French</li><li>1-year post-secondary education (Canadian or ECA equivalent)</li><li>Admissibility (medical, security)</li><li>This is a <strong>direct PR pathway</strong> — not just a work permit</li></ul><h4>Home Support Worker Pilot</h4><ul><li>Job offer in home support work (NOC 44101)</li><li>Same requirements: CLB 5, 1-year education, admissibility</li><li>Also a <strong>direct PR pathway</strong></li></ul><h4>Benefits</h4><ul><li>Less competitive than Express Entry</li><li>Spouse gets open work permit</li><li>Children can study in Canada</li><li>Live-in is NOT required — you can live independently</li><li>Good option for applicants from Philippines, Caribbean, and other regions with caregiving experience</li></ul><h4>Processing</h4><p>12-18 months. Apply online through IRCC portal.</p><h4>Interim Pathway</h4><p>For caregivers already working in Canada — check IRCC for current eligibility windows.</p></div>};

<section className="sec"><div className="wrap"><div className="rv"><div className="lbl">FAQ</div><h2 className="h2">Frequently Asked Questions</h2></div><div style={{maxWidth:'740px',marginTop:'28px'}} className="rv d1"><Acc items={[{title:'Fastest way to get PR?',content:'<p><strong>Express Entry</strong> — ~6 month processing. Maximize CRS via language, education, experience. PNP adds +600 points. Category-based draws have lower cut-offs.</p>'},{title:'How much does it cost?',content:'<p>Gov fees: $2,500–$3,500. Language test: $300. ECA: $250. Medical: $300. Proof of funds: $14,690 (show, not spend). Settlement: $5K–$10K. <strong>Total: ~$8K–$15K CAD.</strong></p>'},{title:'PR without a job offer?',content:'<p><strong>Yes.</strong> Most EE applicants don\'t have one. FSW, CEC, many PNPs don\'t require it.</p>'},{title:'What CRS score do I need?',content:'<p>General: ~520–545. Category (STEM, healthcare): ~380–470. French: ~300–410. PNP: ~680+ (incl. 600 bonus).</p>'},{title:'Can I bring my family?',content:'<p><strong>Yes.</strong> Include spouse and children under 22. After PR, sponsor parents and others.</p>'},{title:'PR vs Citizenship?',content:'<p><strong>PR:</strong> live/work, healthcare, must renew, can lose status. <strong>Citizen:</strong> all PR rights + voting, passport, can\'t lose status abroad, dual citizenship.</p>'},{title:'How long for citizenship?',content:'<p>3 years physical presence + 12–18 month processing = <strong>~4–5 years from PR.</strong></p>'},{title:'IELTS vs CELPIP — which is easier?',content:'<p><strong>CELPIP:</strong> Computer-based, Canadian accent, results in 4-5 days, $280-340. Many find listening easier.<br/><strong>IELTS:</strong> Paper or computer, British/Australian accents, $320-350, accepted worldwide.<br/><strong>PTE Core:</strong> AI-graded, 1-2 day results, $300-350. Good if nervous about human examiners.<br/>If in Canada → try CELPIP. If outside → IELTS (more test centers). If anxious → PTE Core.</p>'},{title:'What are common rejection mistakes?',content:'<p>1. Incomplete forms / wrong version<br/>2. Insufficient proof of funds (need 6mo bank history)<br/>3. Bad reference letters (must include NOC duties, hours, salary, dates)<br/>4. Wrong NOC code (match duties, not job title)<br/>5. Weak spousal proof (need 20-30 pieces of evidence)<br/>6. Missing police clearances (from EVERY country lived 6+ months since age 18)<br/>7. Expired documents (medical valid 12 months only)</p>'},{title:'How do I avoid immigration scams?',content:'<p><strong>Red flags:</strong> "Guaranteed PR", charging $5K+ for LMIA, unlicensed consultants, fake college letters, paying for PNP nomination.<br/><strong>Verify:</strong> Check CICC registry (college-ic.ca) for licensed consultants. IRCC will never call asking for gift cards or Bitcoin.<br/><strong>Report:</strong> Canadian Anti-Fraud Centre 1-888-495-8501.</p>'},{title:'What happens when I land at the airport?',content:'<p>1. Primary inspection (passport + COPR check)<br/>2. May go to secondary (normal for first landing)<br/>3. Officer asks: address, funds, plans<br/>4. COPR confirmed, first entry stamp<br/>5. You are now a PR! 🇨🇦<br/>6. PR card mailed in 4-8 weeks<br/><strong>Carry in hand luggage:</strong> COPR original, passport, proof of funds, Canadian address, all original documents.</p>'}]}/></div></div></section>

{/* PRACTICAL LIFE GUIDES */}
<section className="sec"><div className="wrap">
<div className="rv"><div className="lbl">LIFE IN CANADA</div><h2 className="h2">Practical Survival Guide</h2><p className="sub">The stuff nobody tells you — winter, groceries, tipping, transit, healthcare, and more.</p></div>
<div className="g2" style={{marginTop:'32px'}}>
<div className="card rv d1"><div className="h3" style={{marginBottom:'12px'}}>🧥 Winter Survival</div><div className="body"><ul><li><strong>Essentials (~$500-800):</strong> Insulated jacket (-25°C rated), waterproof boots (Sorel/Columbia), thermal base layers (Uniqlo Heattech), toque, insulated gloves, wool socks</li><li><strong>Buy cheap at:</strong> Winners, Marshalls, Costco, end-of-season sales</li><li><strong>Driving:</strong> Winter tires mandatory in QC/BC highways. Keep emergency kit in car</li><li><strong>Frostbite warning:</strong> Exposed skin can get frostbitten in minutes below -25°C</li><li><strong>SAD (Seasonal Affective Disorder):</strong> Very common. Get a sun lamp ($30-50), take Vitamin D</li><li><strong>Daylight:</strong> Dark by 4:30pm in December. Days are very long in summer to compensate!</li></ul></div></div>
<div className="card rv d2"><div className="h3" style={{marginBottom:'12px'}}>🏥 Healthcare Navigation</div><div className="body"><ul><li><strong>Health card:</strong> Apply ASAP. Waiting period: 3 months (BC/ON) or immediate (AB/SK/MB)</li><li><strong>Gap insurance:</strong> Manulife, Blue Cross, Guard.me (~$100-200/mo)</li><li><strong>Walk-in clinics:</strong> Free with health card, no appointment, 1-3hr wait</li><li><strong>Finding family doctor:</strong> 1-2 year waitlist in many cities. Register on provincial list</li><li><strong>Telehealth:</strong> Call 811 for free health advice 24/7</li><li><strong>Dental/vision:</strong> NOT free — get employer benefits or private insurance</li><li><strong>Ambulance:</strong> $50-400 depending on province. Not always free!</li><li><strong>Pharmacists:</strong> Can prescribe for minor ailments without doctor in most provinces</li></ul></div></div>
<div className="card rv d3"><div className="h3" style={{marginBottom:'12px'}}>🛒 Money-Saving Tips</div><div className="body"><ul><li><strong>Cheapest groceries:</strong> No Frills, FreshCo, Walmart. Use Flipp app for deals</li><li><strong>Bulk buying:</strong> Costco membership ($65/yr) saves hundreds for families</li><li><strong>Phone plans:</strong> Public Mobile, Lucky Mobile ($25-40/mo). Bring unlocked phone</li><li><strong>Transit passes:</strong> Monthly pass vs pay-per-ride depends on usage. Get transit card (Presto/Compass/OPUS)</li><li><strong>Banking:</strong> Scotiabank StartRight = 3 YEARS no monthly fees (best newcomer deal)</li><li><strong>Tax refunds:</strong> File taxes even with no income — triggers GST/HST credit ($300-600/yr) and CCB</li><li><strong>Free furniture:</strong> Facebook Marketplace, Kijiji "free" section, Buy Nothing groups</li><li><strong>Library card:</strong> Free. Gives access to books, WiFi, computers, job resources, some museum passes</li></ul></div></div>
<div className="card rv d4"><div className="h3" style={{marginBottom:'12px'}}>🍁 Cultural Quick Guide</div><div className="body"><ul><li><strong>Tipping:</strong> 15-20% at restaurants (expected!), 10-15% haircuts/taxis. No tip at Tim Hortons/fast food</li><li><strong>Shoes off:</strong> Always remove shoes when entering someone's home</li><li><strong>"Sorry":</strong> Canadians say it constantly. It doesn't always mean apology — sometimes just acknowledgment</li><li><strong>Punctuality:</strong> Being 5+ minutes late is considered rude. On time = polite</li><li><strong>Personal space:</strong> Arm's length. Less touching than many cultures</li><li><strong>Recycling:</strong> Taken very seriously. Wrong bin = fine in some cities. Blue (recycling), green (compost), black (garbage)</li><li><strong>Metric system:</strong> Canada uses Celsius, kilometers, kilograms — except for body height (feet) and cooking (sometimes cups)</li><li><strong>Holidays:</strong> New Year, Family Day (Feb), Good Friday, Victoria Day (May), Canada Day (Jul 1), Labour Day (Sep), Thanksgiving (Oct), Remembrance Day (Nov 11), Christmas</li></ul></div></div>
</div>
</div></section>

<div className="card rv d4"><div className="h3" style={{marginBottom:'8px'}}>🐾 Bringing Pets</div><div className="body" style={{fontSize:'.76rem'}}><p><strong>Dogs:</strong> Rabies vaccine (30+ days before, within 1 year). No quarantine from most countries.</p><p><strong>Cats:</strong> Health certificate within 72hrs. Generally easier than dogs.</p><p><strong>Airlines:</strong> Air Canada, WestJet allow cabin pets (under 8kg). $50-200+ one way. Book early!</p><p><strong>Ontario:</strong> "No pets" in leases is unenforceable. Other provinces vary.</p><p><strong>Vet costs:</strong> Annual checkup $200-400, emergency $500-3000+. Pet insurance $30-80/mo.</p></div></div>
